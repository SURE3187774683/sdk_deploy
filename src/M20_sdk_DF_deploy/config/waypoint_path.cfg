# Training-aligned waypoint command path config

# ── Random waypoint parameters (path_type = 0) ──────────────────────────────
num_waypoints=5
r_min=1.0
r_max=1.0
theta_min=-0.0
theta_max=0.0
point_move_vE_min=0.5
point_move_vE_max=0.5
point_move_vE_cycle_min_points=10
point_move_vE_cycle_max_points=20
obs_num_points=5
reach_threshold=0.5
target_z=0.45
seed=42

# ── Fixed curve selection ──────────────────────────────────────────────────
# path_type:  0 = random(随机)
#             1 = figure-eight(8字形)
#             2 = s-curve(S型)
#             3 = circle(圆形)
#             4 = spiral(螺旋)
#             5 = ellipse(椭圆)
#             6 = rose(玫瑰线)
#             7 = trochoid(次摆线)
#             8 = hypocycloid(内旋轮线)
path_type=3

# curve_scale:      曲线整体尺寸 (m)。圆形将以此为半径，8字形/椭圆以此为长轴，以此类推
curve_scale=1.5
# point_spacing:    等弧长采样间距 (m)，决定路径点密度
point_spacing=1.0
# curve_num_cycles: 循环/圈数，用于螺旋、摆线、次摆线、S型
curve_num_cycles=3.0

# ── Curve-specific parameters ──────────────────────────────────────────
# 玫瑰线: r = curve_scale * cos(rose_n/rose_d * t)
rose_n=3
rose_d=1
# 椭圆: 短轴 = curve_scale * ellipse_b_ratio, 长轴 = curve_scale
ellipse_b_ratio=0.5
# 螺旋: r = spiral_growth * theta  (单位: m/rad)
spiral_growth=0.3
# 次摆线: d/R 比; d<R:扑扒形, d=R:摆线, d>R:带环
trochoid_d_ratio=0.5
# 内旋轮线: R/r 外内圆半径比 (实验: 3=三爬, 4=星形内旋线); d/r 画笔尺寸比
hypocycloid_R_ratio=4.0
hypocycloid_d_ratio=1.5
